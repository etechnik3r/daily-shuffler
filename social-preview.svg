<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles in background -->
  <circle cx="200" cy="100" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="550" r="120" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Main circle container -->
  <g id="meeting-circle">
    <!-- Circle background -->
    <circle cx="640" cy="320" r="180" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Person 1 - Top -->
    <g transform="translate(640, 160)">
      <circle cx="0" cy="0" r="35" fill="url(#accentGradient)"/>
      <circle cx="0" cy="-15" r="12" fill="#fff"/>
      <path d="M -15 5 Q 0 15 15 5" fill="#fff"/>
      <text x="0" y="55" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">1</text>
    </g>
    
    <!-- Person 2 - Right -->
    <g transform="translate(800, 280)">
      <circle cx="0" cy="0" r="35" fill="url(#accentGradient)"/>
      <circle cx="0" cy="-15" r="12" fill="#fff"/>
      <path d="M -15 5 Q 0 15 15 5" fill="#fff"/>
      <text x="0" y="55" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">2</text>
    </g>
    
    <!-- Person 3 - Bottom Right -->
    <g transform="translate(740, 430)">
      <circle cx="0" cy="0" r="35" fill="url(#accentGradient)"/>
      <circle cx="0" cy="-15" r="12" fill="#fff"/>
      <path d="M -15 5 Q 0 15 15 5" fill="#fff"/>
      <text x="0" y="55" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">3</text>
    </g>
    
    <!-- Person 4 - Bottom Left -->
    <g transform="translate(540, 430)">
      <circle cx="0" cy="0" r="35" fill="url(#accentGradient)"/>
      <circle cx="0" cy="-15" r="12" fill="#fff"/>
      <path d="M -15 5 Q 0 15 15 5" fill="#fff"/>
      <text x="0" y="55" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">4</text>
    </g>
    
    <!-- Person 5 - Left -->
    <g transform="translate(480, 280)">
      <circle cx="0" cy="0" r="35" fill="url(#accentGradient)"/>
      <circle cx="0" cy="-15" r="12" fill="#fff"/>
      <path d="M -15 5 Q 0 15 15 5" fill="#fff"/>
      <text x="0" y="55" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">5</text>
    </g>
    
    <!-- Center shuffle button -->
    <circle cx="640" cy="320" r="50" fill="#fff" stroke="url(#accentGradient)" stroke-width="3"/>
    <!-- Shuffle icon -->
    <path d="M 615 310 L 635 310 M 635 310 L 630 305 M 635 310 L 630 315" stroke="#667eea" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 665 330 L 645 330 M 645 330 L 650 325 M 645 330 L 650 335" stroke="#667eea" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Connecting lines with animation -->
  <g opacity="0.4">
    <line x1="640" y1="195" x2="800" y2="280" stroke="#fff" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="800" y1="315" x2="740" y2="395" stroke="#fff" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="740" y1="465" x2="540" y2="465" stroke="#fff" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="540" y1="395" x2="480" y2="315" stroke="#fff" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="480" y1="245" x2="640" y2="195" stroke="#fff" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Title text -->
  <text x="640" y="560" text-anchor="middle" fill="#fff" font-size="48" font-weight="bold" letter-spacing="1">
    Daily Shuffler
  </text>
  
  <!-- Subtitle text -->
  <text x="640" y="600" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="20" letter-spacing="0.5">
    Randomize Your Meeting Order
  </text>
</svg>